context_intent_analysis:
  description: |
    Analyze the incoming user message alongside historical context and semantic memories to extract intent, relevant background, and conversation flow. 
    - Current Message: `{input_message}`
    - Semantic Memories: `{semantic_memory_context}`
    - Recent Conversations: `{most_recent_conversations}`
    
    Synthesize these inputs to determine what the user wants, what context is relevant, and how it connects to past interactions.
  expected_output: | 
    A strict JSON object with the following schema:
    ```json
    {
      "user_intent": "string (core goal of the input_message)",
      "relevant_semantic_context": ["string (filtered highlights from semantic_memory_context)"],
      "conversation_continuity": "string (summary of recent dialogue flow)",
      "key_entities_or_constraints": ["string"]
    }
    ```

final_response_generation:
  description: |
    Take the structured JSON analysis from the previous task and formulate a coherent, context-aware, and natural final response to the user. Ensure the tone matches the context and directly addresses the `{input_message}` using the insights provided in the JSON.
  expected_output: |
    A single, clean string representing the final response text (no markdown code blocks unless specified, just the raw conversational string).
